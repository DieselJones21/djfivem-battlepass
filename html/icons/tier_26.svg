<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1028"/>
      <stop offset="1" stop-color="#0b0812"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="28%" r="62%">
      <stop offset="0" stop-color="#c4a574" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>
  <rect width="256" height="256" rx="32" fill="url(#spot)"/>
  <rect x="10" y="10" width="236" height="236" rx="24" fill="none" stroke="#f9a8d4" stroke-opacity="0.38" stroke-width="2"/>
  
  <g filter="url(#glow)" transform="translate(58,58)">
